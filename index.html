<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AgentsInTheCloud — coming soon.">
  <meta name="theme-color" content="#171d29">
  <title>AgentsInTheCloud — Coming soon</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #171d29; color: #eceff4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 2rem; background: radial-gradient(ellipse at 50% 0%, #283b4b, transparent 65%); }
    main { width: min(100%, 52rem); text-align: center; }
    .mark { display: inline-grid; place-items: center; width: 4rem; height: 4rem; margin-bottom: 2rem; border: 1px solid #88c0d04d; border-radius: 1rem; background: #88c0d00d; color: #88c0d0; font-size: 1rem; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 0; font-size: clamp(1.7rem, 6vw, 3.8rem); font-weight: 650; letter-spacing: -.045em; overflow-wrap: anywhere; }
    p { margin: 1.2rem 0 0; color: #aebacc; font-size: 1.1rem; line-height: 1.6; }
    .status { display: inline-block; margin-top: 2.5rem; padding: .5rem 1rem; border: 1px solid #ffffff20; border-radius: 2rem; color: #88c0d0; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">AITC</div>
    <h1>AgentsInTheCloud</h1>
    <p>A home for your AI agents.</p>
    <span class="status">Coming soon</span>
  </main>
</body>
</html>
